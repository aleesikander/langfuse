---
name: Check GitHub Actions

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "v3"
  merge_group:
  pull_request:
    branches:
      - "main"
      - "v3"

permissions: {}

jobs:
  zizmor:
    name: Check GitHub Actions security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Garnet Runtime Review
        uses: garnet-org/action@245ad6be82de3200c205109c8ca7ac816dc692ea # v2.3.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.17.0

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: ${{ github.event_name == 'push' && 'true' || 'false' }}
          min-severity: low
